name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libpq-dev
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Run tests
        run: zig build test

      - name: Release build
        run: zig build -Doptimize=ReleaseSafe
