name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libpq-dev
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      # TODO: switch to mlugg/setup-zig@v1 once mirrors carry 0.15.2
      - name: Setup Zig
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-linux-x86_64-0.15.2.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.15.2" >> "$GITHUB_PATH"

      - name: Run tests
        run: zig build test

      - name: Release build
        run: zig build -Doptimize=ReleaseSafe
