name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: Build gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libpq is NOT installed: lux uses pg.zig (pure Zig) and links no C libraries.
      # Verified by `grep -r '@cImport\|linkSystemLibrary' build.zig src/` returning nothing.

      - name: Setup Node (Biome)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Pinned, not "latest": an unpinned binary that is chmod +x'd and run is a
      # supply-chain hole, and `latest` silently changed the asset name — the old
      # zlint-x86_64-linux URL now 404s, which would fail the lint gate.
      - name: Install zlint
        run: |
          curl -fsSL https://github.com/DonIsaac/zlint/releases/download/v0.9.1/zlint-linux-x86_64 -o /usr/local/bin/zlint
          echo "3290bd511d37e4f6ccca3621b9894cd6c378195cdaac27520d0bd894058b2b9b  /usr/local/bin/zlint" | sha256sum -c -
          chmod +x /usr/local/bin/zlint

      # TODO: switch to mlugg/setup-zig@v1 once mirrors carry 0.15.2
      - name: Setup Zig
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-0.15.2-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: zig-0.15.2-${{ runner.os }}-

      - name: Gate 1 — zig build test
        run: zig build test

      - name: Gate 2 — zig build -Doptimize=ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe

      - name: Gate 3 — zig build lint
        run: zig build lint

  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check (svelte-check)
        working-directory: frontend
        run: pnpm run check

      - name: Component + unit tests (vitest)
        working-directory: frontend
        run: pnpm test
