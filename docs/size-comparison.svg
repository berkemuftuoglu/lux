<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img"
     aria-label="Binary size: Lux 1.4 MB, TablePlus 90 MB, DBeaver 115 MB, Beekeeper Studio 160 MB, pgAdmin 200 MB">
  <style>
    .lbl  { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8b949e; }
    .val  { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8b949e; }
    .lux  { fill: #e0a458; }
    .them { fill: #8b949e; opacity: .30; }
    .luxl { fill: #e0a458; }
    .cap  { font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6e7681; }
    .bar  { transform-origin: 150px 0; animation: grow 1.1s cubic-bezier(.22,1,.36,1) both; }
    .b1 { animation-delay: .05s } .b2 { animation-delay: .17s } .b3 { animation-delay: .29s }
    .b4 { animation-delay: .41s } .b5 { animation-delay: .53s }
    .fade { animation: fade .5s ease-out both; }
    .f1 { animation-delay: .70s } .f2 { animation-delay: .80s }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .bar, .fade { animation: none; }
    }
  </style>

  <text x="150" y="26" class="lbl" style="fill:#e0a458">Binary size</text>

  <g transform="translate(0,52)">
    <text x="138" y="12" text-anchor="end" class="lbl" style="fill:#e0a458">lux</text>
    <rect class="bar b1 lux" x="150" y="2" width="4" height="13" rx="2"/>
    <text x="164" y="13" class="val luxl">1.4 MB</text>
  </g>

  <g transform="translate(0,88)">
    <text x="138" y="12" text-anchor="end" class="lbl">TablePlus</text>
    <rect class="bar b2 them" x="150" y="2" width="252" height="13" rx="2"/>
    <text x="412" y="13" class="val">90 MB</text>
  </g>

  <g transform="translate(0,124)">
    <text x="138" y="12" text-anchor="end" class="lbl">DBeaver</text>
    <rect class="bar b3 them" x="150" y="2" width="322" height="13" rx="2"/>
    <text x="482" y="13" class="val">115 MB</text>
  </g>

  <g transform="translate(0,160)">
    <text x="138" y="12" text-anchor="end" class="lbl">Beekeeper</text>
    <rect class="bar b4 them" x="150" y="2" width="448" height="13" rx="2"/>
    <text x="608" y="13" class="val">160 MB</text>
  </g>

  <g transform="translate(0,196)">
    <text x="138" y="12" text-anchor="end" class="lbl">pgAdmin</text>
    <rect class="bar b5 them" x="150" y="2" width="560" height="13" rx="2"/>
    <text x="720" y="13" class="val">200 MB</text>
  </g>

  <text x="150" y="243" class="cap fade f1">lux ships one 1.4 MB binary — and links nothing but libc.</text>
</svg>
